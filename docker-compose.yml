services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openvio_linkedin
      POSTGRES_USER: openvio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432" # loopback only: never expose the database to the network
    security_opt:
      - no-new-privileges:true
    volumes:
      - openvio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvio -d openvio_linkedin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  openvio_postgres_data:
